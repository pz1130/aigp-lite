name: Feature request
description: Suggest a new capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What governance task is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Related framework or regulation
      description: Optional, e.g. EU AI Act Art. 26, NIST AI RMF MAP 1.1, ISO/IEC 42001 A.6.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
