services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aigp
      POSTGRES_PASSWORD: aigp
      POSTGRES_DB: aigp
    ports:
      - "5432:5432"
    volumes:
      - aigp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigp -d aigp"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aigp:aigp@db:5432/aigp?schema=public

  web:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://aigp:aigp@db:5432/aigp?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me-in-prod}
      NEXTAUTH_URL: http://localhost:3000
      AIGP_ENCRYPTION_KEY: ${AIGP_ENCRYPTION_KEY:-}
      AIGP_ENCRYPTION_SEED: ${AIGP_ENCRYPTION_SEED:-aigp-dev-default}
      AIGP_STORAGE_DRIVER: ${AIGP_STORAGE_DRIVER:-local}
      AIGP_STORAGE_ROOT: ${AIGP_STORAGE_ROOT:-/app/storage/evidence}
      AIGP_S3_BUCKET: ${AIGP_S3_BUCKET:-}
      AIGP_S3_REGION: ${AIGP_S3_REGION:-us-east-1}
      AIGP_S3_ENDPOINT: ${AIGP_S3_ENDPOINT:-}
      AIGP_S3_FORCE_PATH_STYLE: ${AIGP_S3_FORCE_PATH_STYLE:-false}
      AIGP_S3_PREFIX: ${AIGP_S3_PREFIX:-evidence}
      AIGP_S3_ACCESS_KEY_ID: ${AIGP_S3_ACCESS_KEY_ID:-}
      AIGP_S3_SECRET_ACCESS_KEY: ${AIGP_S3_SECRET_ACCESS_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - aigp_storage:/app/storage

volumes:
  aigp_pg:
  aigp_storage:
