# Production override. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What it changes versus the dev stack (see docs/deployment.md):
#   - db / redis are NOT published to the host (reachable only on the compose network)
#   - web binds to 127.0.0.1:3000 only; put an HTTPS reverse proxy in front of it
#   - no fallback secrets: POSTGRES_PASSWORD, NEXTAUTH_SECRET, NEXTAUTH_URL and
#     AIGP_ENCRYPTION_KEY must be set, or `docker compose` refuses to start
#   - POSTGRES_PASSWORD is interpolated into DATABASE_URL unescaped, so it must be
#     URL-safe (e.g. `openssl rand -hex 32`; base64 output is NOT)
#   - the migrate job loads reference catalogs only (AIGP_SEED_DEMO=0), so no
#     demo org / demo1234 users are created
#
# Requires Docker Compose v2.24+ (for the `!reset` / `!override` merge tags).

services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

  redis:
    ports: !reset []

  migrate:
    environment:
      DATABASE_URL: postgresql://aigp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/aigp?schema=public
      AIGP_SEED_DEMO: "0"

  web:
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://aigp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/aigp?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set (openssl rand -base64 32)}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL must be set to the public https:// origin}
      AIGP_ENCRYPTION_KEY: ${AIGP_ENCRYPTION_KEY:?AIGP_ENCRYPTION_KEY must be set (openssl rand -base64 32)}

  worker:
    environment:
      DATABASE_URL: postgresql://aigp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/aigp?schema=public
      AIGP_ENCRYPTION_KEY: ${AIGP_ENCRYPTION_KEY:?AIGP_ENCRYPTION_KEY must be set (openssl rand -base64 32)}
